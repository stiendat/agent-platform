name: Hackathon — DB Reset & Seed

on:
  workflow_dispatch:
    inputs:
      tenant:
        description: 'Tenant slug (default: hackathon)'
        required: false
        default: 'hackathon'
      tenant_name:
        description: 'Tenant display name (defaults to slug)'
        required: false
        default: ''
      admin_email:
        description: 'Admin email'
        required: false
        default: 'admin@hackathon.com'
      password:
        description: 'Default password for seeded users'
        required: false
        default: 'ChangeMe@2026'
      only:
        description: 'Comma-separated phases to run: users,planner,availability,performance (default: all)'
        required: false
        default: ''
      perf_count:
        description: 'ARIA: number of synthetic employees'
        required: false
        default: '200'
      perf_months:
        description: 'ARIA: months of review history (monthly periods)'
        required: false
        default: '6'
      perf_end_period:
        description: 'ARIA: most-recent review period (YYYY-MM)'
        required: false
        default: '2026-04'
      perf_seed:
        description: 'ARIA: PRNG seed (same seed → identical data)'
        required: false
        default: '42'

concurrency:
  group: hackathon-db-seed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  db-seed:
    name: Reset DB & seed demo data → ${{ github.event.inputs.tenant }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: SSH seed to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          TENANT:       ${{ github.event.inputs.tenant }}
          TENANT_NAME:  ${{ github.event.inputs.tenant_name }}
          ADMIN_EMAIL:  ${{ github.event.inputs.admin_email }}
          SEED_PASSWORD: ${{ github.event.inputs.password }}
          ONLY:         ${{ github.event.inputs.only }}
          PERF_COUNT:       ${{ github.event.inputs.perf_count }}
          PERF_MONTHS:      ${{ github.event.inputs.perf_months }}
          PERF_END_PERIOD:  ${{ github.event.inputs.perf_end_period }}
          PERF_SEED:        ${{ github.event.inputs.perf_seed }}
        with:
          host:     ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs:     TENANT,TENANT_NAME,ADMIN_EMAIL,SEED_PASSWORD,ONLY,PERF_COUNT,PERF_MONTHS,PERF_END_PERIOD,PERF_SEED
          script: |
            set -euo pipefail
            echo "=== Resetting DB and seeding tenant: $TENANT ==="

            ARGS="--tenant $TENANT --admin-email $ADMIN_EMAIL --password $SEED_PASSWORD"
            [ -n "$TENANT_NAME" ]      && ARGS="$ARGS --tenant-name $TENANT_NAME"
            [ -n "$ONLY" ]             && ARGS="$ARGS --only $ONLY"
            [ -n "$PERF_COUNT" ]       && ARGS="$ARGS --perf-count $PERF_COUNT"
            [ -n "$PERF_MONTHS" ]      && ARGS="$ARGS --perf-months $PERF_MONTHS"
            [ -n "$PERF_END_PERIOD" ]  && ARGS="$ARGS --perf-end-period $PERF_END_PERIOD"
            [ -n "$PERF_SEED" ]        && ARGS="$ARGS --perf-seed $PERF_SEED"

            cd /opt/platform

            echo "--- Stopping stack and wiping volumes ---"
            docker compose --env-file /opt/seta/.env down -v

            echo "--- Starting postgres ---"
            docker compose --env-file /opt/seta/.env up -d postgres

            echo "--- Running migrations ---"
            docker compose --env-file /opt/seta/.env run --rm migrator

            echo "--- Seeding data ---"
            docker compose --env-file /opt/seta/.env run --rm \
              -e DATABASE_URL \
              seeder seed $ARGS

            echo "--- Bringing stack back up ---"
            docker compose --env-file /opt/seta/.env up -d

            echo "=== Reset and seed complete ==="
